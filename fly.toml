app = 'jirb-bookshelf'
primary_region = 'iad'

[build]

[env]
  PORT = '3000'
  DB_FILE = '/data/app.db'

[[mounts]]
  source = 'bookshelf_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '15s'
    interval = '30s'
    method = 'GET'
    path = '/api/health'
    timeout = '5s'

[deploy]
  strategy = 'immediate'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
